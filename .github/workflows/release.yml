name: Release

# Manual workflow: run it from the Actions tab (works from a phone browser).
# It tags the current master (or the commit given in ref) as v<version> and publishes a GitHub release
# using docs/CHANGES-<version>.md as release notes, attaches the binaries (binaries.yml) and
# updates the Homebrew formula and the conda recipe (packaging/).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v (e.g. 2.0.2)"
        required: true
        type: string
      ref:
        description: "Optional: commit (SHA) to release; default is the tip of master. It lets an earlier commit of master be released."
        required: false
        type: string
      latest:
        description: "Mark it as the latest release and update the Homebrew formula and the conda recipe (leave unchecked for an earlier version)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'master' }}

      - name: Check version
        run: |
          V="${{ inputs.version }}"
          grep -q "^VERSION = $V\$" Makefile || { echo "Makefile VERSION is not $V"; exit 1; }
          test -f "docs/CHANGES-$V.md" || { echo "docs/CHANGES-$V.md not found"; exit 1; }
          if git ls-remote --tags origin "refs/tags/v$V" | grep -q .; then
            echo "Tag v$V already exists"; exit 1
          fi

      - name: Build (smoke test)
        run: make

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"
          LATEST=--latest
          [ "${{ inputs.latest }}" = "true" ] || LATEST=--latest=false
          gh release create "v$V" --target "$(git rev-parse HEAD)" --title "CellCoal $V" \
            --notes-file "docs/CHANGES-$V.md" $LATEST

  binaries:
    needs: release
    uses: ./.github/workflows/binaries.yml
    with:
      tag: v${{ inputs.version }}

  packaging:
    # writes the Homebrew formula and the conda recipe for the new tag (they need the SHA-256 of the tag's archive)
    needs: release
    if: inputs.latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Update Formula/cellcoal.rb and conda/meta.yaml
        run: |
          V="${{ inputs.version }}"
          curl -fsSL -o src.tar.gz "https://github.com/${{ github.repository }}/archive/refs/tags/v$V.tar.gz"
          python3 tools/make_packaging.py "$V" src.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula conda/meta.yaml
          git commit -m "Packaging files for v$V" || exit 0
          git push origin HEAD:master
