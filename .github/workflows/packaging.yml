name: Packaging test

# Installs CellCoal from the Homebrew formula (Formula/cellcoal.rb) and builds the conda recipe (conda/), as a user would,
# and runs a small simulation with each. Both files are generated by the Release workflow for the tag they point to, so
# this checks the latest release. Run it by hand, or it runs by itself after each release.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  homebrew:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Install from the formula
        run: |
          brew tap-new local/cellcoal
          cp Formula/cellcoal.rb "$(brew --repository local/cellcoal)/Formula/"
          brew install --build-from-source local/cellcoal/cellcoal

      - name: Formula test and a run
        run: |
          brew test local/cellcoal/cellcoal
          mkdir t && cd t && cellcoal -n2 -s20 -l1000 -u1e-6 -e10000 -b1 -C10 -E0.001 -1 -8 -#3 > out.txt 2>&1
          test -s Results/snv_gen && test -s Results/catg
          cellcoal --config "$(brew --prefix)/share/cellcoal/examples/config.example.yaml" -n1 > out2.txt 2>&1
          test -s Results/run.json

  conda:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Build the recipe
        shell: bash -el {0}
        run: |
          conda install -y conda-build
          conda build conda --output-folder /tmp/conda-bld -c conda-forge

      - name: Install the package and run
        shell: bash -el {0}
        run: |
          conda create -y -n t -c /tmp/conda-bld -c conda-forge cellcoal
          conda activate t
          mkdir t && cd t && cellcoal -n2 -s20 -l1000 -u1e-6 -e10000 -b1 -C10 -E0.001 -1 -8 -#3 > out.txt 2>&1
          test -s Results/snv_gen && test -s Results/catg
