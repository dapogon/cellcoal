name: Binaries

# Builds the program for Linux (static, with OpenMP), macOS (Apple silicon, with libomp bundled) and Windows (MSYS2 UCRT64, with OpenMP; the compiler's DLLs are bundled).
# - run it by hand to test the builds (the tarballs are kept as workflow artifacts), or with a tag to attach them to that release;
# - the Release workflow calls it with the tag to attach the tarballs to the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional: release tag to build and attach the tarballs to (e.g. v2.1.7)"
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Build
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then make LDFLAGS=-static; else make; fi
          V=$(sed -n 's/^VERSION = //p' Makefile)
          D="cellcoal-$V-${{ matrix.name }}"
          mkdir -p "$D"
          cp "bin/cellcoal-$V" "$D/cellcoal"
          cp tools/bulk_vaf.py "$D/cellcoal-bulk-vaf"
          cp README.md "docs/CHANGES-$V.md" docs/cellcoal.manual.v2.0.html "$D/"
          cp -R examples parameters "$D/"
          if [ "$RUNNER_OS" = "macOS" ]; then
            L=$(otool -L "$D/cellcoal" | awk '/libomp/{print $1}')
            if [ -n "$L" ]; then
              cp "$(brew --prefix libomp)/lib/libomp.dylib" "$D/libomp.dylib"
              chmod 755 "$D/libomp.dylib"
              install_name_tool -change "$L" @executable_path/libomp.dylib "$D/cellcoal"
            fi
          fi
          echo "DIR=$D" >> "$GITHUB_ENV"

      - name: Smoke test
        run: |
          mkdir t && cd t && "../$DIR/cellcoal" -n2 -s20 -l1000 -u1e-6 -e10000 -b1 -C10 -E0.001 -1 -8 -#3 >out.txt 2>&1
          test -s Results/snv_gen && test -s Results/catg

      - name: Pack
        run: |
          tar czf "$DIR.tar.gz" "$DIR"
          shasum -a 256 "$DIR.tar.gz" > "$DIR.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIR }}
          path: ${{ env.DIR }}.tar.gz*

      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "$DIR.tar.gz" "$DIR.tar.gz.sha256" --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: make diffutils zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libgomp python

      - name: Build and pack
        shell: msys2 {0}
        run: |
          make
          V=$(sed -n 's/^VERSION = //p' Makefile)
          D="cellcoal-$V-windows-x86_64"
          mkdir -p "$D"
          cp "bin/cellcoal-$V.exe" "$D/cellcoal.exe" 2>/dev/null || cp "bin/cellcoal-$V" "$D/cellcoal.exe"
          # the runtime libraries of the compiler (libgomp, winpthread, ...) go next to the program
          for L in $(ldd "$D/cellcoal.exe" | awk '/ucrt64|mingw64/{print $3}'); do cp "$L" "$D/"; done
          cp tools/bulk_vaf.py "$D/cellcoal-bulk-vaf.py"
          cp README.md "docs/CHANGES-$V.md" docs/cellcoal.manual.v2.0.html "$D/"
          cp -R examples parameters "$D/"
          mkdir t && cd t && "../$D/cellcoal.exe" -n2 -s20 -l1000 -u1e-6 -e10000 -b1 -C10 -E0.001 -1 -8 -#3 >out.txt 2>&1
          test -s Results/snv_gen && test -s Results/catg
          cd ..
          ldd "$D/cellcoal.exe" | grep -v -i "windows\|system32" || true
          zip -rq "$D.zip" "$D"
          sha256sum "$D.zip" > "$D.zip.sha256"
          echo "DIR=$D" >> "$GITHUB_ENV"

      - name: Test the zip from plain PowerShell (outside MSYS2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = 'C:\Windows\System32;C:\Windows'   # nothing from MSYS2: only the DLLs in the zip
          New-Item -ItemType Directory -Force C:\zt | Out-Null
          Expand-Archive -Path "$env:DIR.zip" -DestinationPath C:\zt -Force
          $exe = "C:\zt\$env:DIR\cellcoal.exe"
          Set-Location C:\zt
          & $exe -n2 -s20 -l1000 -u1e-6 -e10000 -b1 -C10 -E0.001 -1 -8 --summary -#3 *> out.txt
          if ($LASTEXITCODE -ne 0) { Get-Content out.txt; throw "cellcoal.exe failed ($LASTEXITCODE)" }
          foreach ($f in 'Results\snv_gen', 'Results\catg', 'Results\summary.tsv', 'Results\run.json') {
            if (-not (Test-Path $f) -or (Get-Item $f).Length -eq 0) { throw "missing $f" }
          }
          if (-not (Select-String -Quiet '"openmp": true' Results\run.json)) { throw "built without OpenMP" }
          & $exe -n2 -s8 -l200 -u1e-6 -e10000 -b1 --sweep "C=2,4" -oSW *> sw.txt
          if ($LASTEXITCODE -ne 0) { Get-Content sw.txt; throw "sweep failed" }
          if ((Get-Content SW\sweep.tsv).Count -ne 3) { throw "sweep.tsv should have 3 lines" }
          Write-Host "The Windows zip works from PowerShell"

      - uses: actions/upload-artifact@v4
        with:
          name: cellcoal-windows-x86_64
          path: |
            cellcoal-*-windows-x86_64.zip
            cellcoal-*-windows-x86_64.zip.sha256

      - name: Attach to the release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" cellcoal-*-windows-x86_64.zip cellcoal-*-windows-x86_64.zip.sha256 --clobber
