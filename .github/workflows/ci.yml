name: CI

# Build and run the regression tests (make test) on every push and pull request.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# pipefail: a failing 'make test | tee' must fail the step
defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install Python packages for the plots (tools/)
        run: |
          python3 -m pip install --user numpy matplotlib 2>/dev/null || python3 -m pip install --user --break-system-packages numpy matplotlib

      - name: Install bcftools (to check the BCF output)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y bcftools; else brew install bcftools; fi
          bcftools --version | head -1

      - name: Build
        run: make -k

      - name: Test
        run: |
          python3 -c "import numpy, matplotlib; print('plots: numpy', numpy.__version__, 'matplotlib', matplotlib.__version__)"
          make test | tee test.log
          ! grep -q 'skip (matplotlib' test.log
          grep -q 'bcftools reads' test.log

  # The same tests with other compilers and without OpenMP (results must not depend on either)
  variants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "clang",             cc: clang, omp: "default"}
          - {name: "gcc, no OpenMP",    cc: gcc,   omp: "none"}
          - {name: "clang, no OpenMP",  cc: clang, omp: "none"}
    name: variant (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bcftools clang libomp-dev
          python3 -m pip install --user numpy matplotlib 2>/dev/null || python3 -m pip install --user --break-system-packages numpy matplotlib
      - name: Build
        run: |
          if [ "${{ matrix.omp }}" = "none" ]; then make CC=${{ matrix.cc }} OMPFLAG=; else make CC=${{ matrix.cc }}; fi
      - name: Test
        run: make test

  # AddressSanitizer and UndefinedBehaviorSanitizer: the tests, then a fuzzer of the command line and of --config
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bcftools
          python3 -m pip install --user numpy matplotlib 2>/dev/null || python3 -m pip install --user --break-system-packages numpy matplotlib
      - name: Build with sanitizers
        run: make CFLAGS="-Wall -O1 -g -ffp-contract=off -fno-math-errno -fsanitize=address,undefined -fno-omit-frame-pointer -fopenmp -DUSE_COLORS" LDFLAGS="-fsanitize=address,undefined"
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make test
      - name: Fuzz the options and the configuration parser
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          for seed in 1 2 3; do python3 tests/fuzz.py bin/cellcoal-$(sed -n 's/^VERSION = //p' Makefile) --runs 400 --seed $seed; done

  # Line coverage of the tests (informative: written to the job summary)
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bcftools
          python3 -m pip install --user numpy matplotlib 2>/dev/null || python3 -m pip install --user --break-system-packages numpy matplotlib
      - name: Build with coverage
        run: make CFLAGS="-Wall -O0 -g -ffp-contract=off -fno-math-errno --coverage -fopenmp -DUSE_COLORS" LDFLAGS="--coverage"
      - name: Test
        run: make test
      - name: Coverage summary
        run: python3 tools/gcov_summary.py out | tee -a "$GITHUB_STEP_SUMMARY"

  speed:
    # builds the latest release and the new code on the same runner and fails if the new code is more than 25% slower
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the new code
        run: make && cp bin/cellcoal-* /tmp/cellcoal-new
      - name: Build the latest release
        run: |
          tag=$(git tag --sort=-v:refname | head -1)
          echo "Reference release: $tag"
          git worktree add /tmp/ref "$tag"
          (cd /tmp/ref && make && cp bin/cellcoal-* /tmp/cellcoal-ref)
      - name: Compare speed
        run: python3 tests/bench.py /tmp/cellcoal-ref /tmp/cellcoal-new --max-ratio 1.25 | tee -a "$GITHUB_STEP_SUMMARY"

  windows:
    # Windows (MSYS2, MinGW-w64): build and smoke tests; the whole suite runs too but does not fail the job yet
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: make mingw-w64-ucrt-x86_64-gcc python
      - name: Build
        run: make -k
      - name: Smoke tests
        run: |
          set -e
          bin=$(ls bin/cellcoal-* | head -1)
          mkdir -p /tmp/w && cd /tmp/w
          "$OLDPWD/$bin" -n2 -s10 -l500 -u1e-6 -e10000 -b1 -C8 -E0.001 -P0.2 0.02 -B0.1 0.01 --summary -v -#3 > /dev/null
          test -s Results/summary.tsv
          test -s Results/vcf_dir/vcf.0001
          "$OLDPWD/$bin" -n2 -s8 -l200 -u1e-6 -e10000 -b1 --sweep "C=2,4" -oSW > /dev/null
          test "$(wc -l < SW/sweep.tsv)" -eq 3
          "$OLDPWD/$bin" -n2 -s8 -l200 -u1e-6 -e10000 -b1 -oRR > /dev/null
          "$OLDPWD/$bin" -n2 -s8 -l200 -u1e-6 -e10000 -b1 -oRR > /dev/null
          echo "Windows smoke tests passed"
      - name: Diagnostics for the checks that fail on Windows
        continue-on-error: true
        run: |
          bin=$(ls $PWD/bin/cellcoal-* | head -1)
          mkdir -p /tmp/d1 && cd /tmp/d1
          echo "=== bulk (-0)"; $bin -n2 -s60 -l3000 -u1e-6 -e10000 -g1e-4 -b1 -C5 -V1 -E0 -0 -#7 > out.txt 2>&1; echo "exit code $?"; tail -5 out.txt; ls -la Results
          mkdir -p /tmp/d2 && cd /tmp/d2
          echo "=== -Y with --fast"; $bin --fast -n2 -s30 -l800 -u1e-6 -e10000 -b1 -C10 -Y -#31 > out.txt 2>&1; echo "exit code $?"; tail -5 out.txt; ls -la Results
          mkdir -p /tmp/d3 && cd /tmp/d3
          echo "=== run.json"; $bin -n2 -s20 -l300 -u1e-6 -e10000 -b1 -C5 -#99 > out.txt 2>&1; echo "exit code $?"; cat Results/run.json | head -30
          cd /tmp/d3 && mkdir c && cd c && $bin --config ../Results/run.json > out.txt 2>&1; echo "config exit code $?"; tail -5 out.txt; ls Results
      - name: Diagnostics 2 (determinism and differences)
        continue-on-error: true
        run: |
          bin=$(ls $PWD/bin/cellcoal-* | head -1)
          A="-n2 -s30 -l800 -u1e-6 -e10000 -b1 -C10 -Y -#31"
          for d in r1 r2 r3; do mkdir -p /tmp/$d; done
          (cd /tmp/r1 && $bin $A > o.txt 2>&1); (cd /tmp/r2 && $bin $A > o.txt 2>&1); (cd /tmp/r3 && $bin --fast $A > o.txt 2>&1)
          echo "=== same command twice: true_hap"; cmp /tmp/r1/Results/true_hap /tmp/r2/Results/true_hap && echo identical
          echo "=== with and without --fast: true_hap"; cmp /tmp/r1/Results/true_hap /tmp/r3/Results/true_hap && echo identical
          diff /tmp/r1/Results/true_hap /tmp/r3/Results/true_hap | head -6 | cut -c1-150
          echo "=== line endings"; head -c 200 /tmp/r1/Results/true_hap | od -c | head -5
          echo "=== bulk stored vs streamed"
          B="-n2 -s60 -l3000 -u1e-6 -e10000 -g1e-4 -b1 -C5 -V1 -E0 -0 -#7"
          mkdir -p /tmp/b0 /tmp/b1; (cd /tmp/b0 && CELLCOAL_STREAM=0 $bin $B > o.txt 2>&1); (cd /tmp/b1 && CELLCOAL_STREAM=1 $bin $B > o.txt 2>&1)
          cmp /tmp/b0/Results/bulk /tmp/b1/Results/bulk && echo identical
          diff /tmp/b0/Results/bulk /tmp/b1/Results/bulk | head -6 | cut -c1-150
          grep -i "storage\|reads_mode" /tmp/b0/Results/run.json /tmp/b1/Results/run.json
      - name: Whole suite (informative)
        continue-on-error: true
        run: make test
