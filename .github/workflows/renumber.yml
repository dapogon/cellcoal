name: Renumber releases (one-off)

# One-off: 2.2.0-2.7.0 become 2.1.1-2.1.6. The renumbered commits are in the branches renum-2.1.N.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renumber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace the releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for pair in 2.2.0:2.1.1 2.3.0:2.1.2 2.4.0:2.1.3 2.5.0:2.1.4 2.6.0:2.1.5 2.7.0:2.1.6; do
            old=${pair%%:*}; new=${pair##*:}
            sha=$(git rev-parse "origin/renum-$new")
            git show "$sha:docs/CHANGES-$new.md" > "notes-$new.md"
            gh release delete "v$old" --cleanup-tag --yes || true
            git push origin --delete "v$old" 2>/dev/null || true
            gh release create "v$new" --target "$sha" --title "CellCoal $new" --notes-file "notes-$new.md" --latest=false
            git push origin --delete "renum-$new"
            echo "v$old -> v$new ($sha)"
          done
