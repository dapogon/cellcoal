{% set version = "2.5.0" %}

package:
  name: cellcoal
  version: {{ version }}

source:
  url: https://github.com/dapogon/cellcoal/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 5f55b603aa27ad201475025fdf863a93db8cf2eb0dbb7b2d3c3043145a22c46a

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - make
  host:
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
  run:
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    - python       # for cellcoal-bulk-vaf
    - matplotlib-base

test:
  commands:
    - mkdir -p t && cd t && cellcoal -n1 -s10 -l200 -u1e-6 -e10000 -b1 -#1
    - test -d Results

about:
  home: https://github.com/dapogon/cellcoal
  license: GPL-2.0-or-later
  summary: Coalescent simulator of single-cell NGS data
