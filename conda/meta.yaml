{% set version = "2.2.6" %}

package:
  name: cellcoal
  version: {{ version }}

source:
  url: https://github.com/dapogon/cellcoal/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 450341260d0746364134af68590621af695782cd34251a2dcc9d55f6778ec0fd

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - make
  host:
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
  run:
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    - python       # for cellcoal-bulk-vaf
    - matplotlib-base

test:
  commands:
    - mkdir -p t && cd t && cellcoal -n1 -s10 -l200 -u1e-6 -e10000 -b1 -#1
    - test -d Results

about:
  home: https://github.com/dapogon/cellcoal
  license: GPL-2.0-or-later
  summary: Coalescent simulator of single-cell NGS data
