{% set version = "2.5.3" %}

package:
  name: cellcoal
  version: {{ version }}

source:
  url: https://github.com/dapogon/cellcoal/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 9dbc7c423ff7e0e62b2e731930e0e7a8550bdf486b0cc5ad27b7b007e7be69eb

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - make
  host:
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
  run:
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    - python       # for cellcoal-bulk-vaf
    - matplotlib-base

test:
  commands:
    - mkdir -p t && cd t && cellcoal -n1 -s10 -l200 -u1e-6 -e10000 -b1 -#1
    - test -d Results

about:
  home: https://github.com/dapogon/cellcoal
  license: GPL-2.0-or-later
  summary: Coalescent simulator of single-cell NGS data
